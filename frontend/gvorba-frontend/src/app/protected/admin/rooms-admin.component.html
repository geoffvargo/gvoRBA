<div class="min-h-[calc(100vh-74px)] bg-base-200 p-4 flex justify-center content-center w-auto items-start">
	<div class="card shadow-lg bg-base-100 flex flex-col py-4 overflow-x-auto w-fit justify-center top-0">
		<h1 class="text-center text-2xl font-bold">
			Room Management
		</h1>
		
		@if (isLoading()) {
			<span>Loading...</span>
		} @else {
			<div class="card-body flex justify-center items-center">
				<table class="mat-elevation-x8 mx-16 w-max"
				       mat-table
				       matSort
				       [dataSource]="dataSource">
					
					<ng-container matColumnDef="id">
						<th mat-header-cell
						    *matHeaderCellDef
						    mat-sort-header="id">
							Id
						</th>
						<td mat-cell
						    *matCellDef="let room">
							{{ room.id }}
						</td>
					</ng-container>
					
					<ng-container matColumnDef="name">
						<th mat-header-cell
						    *matHeaderCellDef
						    mat-sort-header="name">
							Name
						</th>
						<td mat-cell
						    *matCellDef="let room">
							{{ room.name }}
						</td>
					</ng-container>
					
					<ng-container matColumnDef="location">
						<th mat-header-cell
						    *matHeaderCellDef
						    mat-sort-header="location">
							Location
						</th>
						<td mat-cell
						    *matCellDef="let room">
							{{ room.location }}
						</td>
					</ng-container>
					
					<ng-container matColumnDef="capacity">
						<th mat-header-cell
						    *matHeaderCellDef
						    mat-sort-header="capacity">
							Capacity
						</th>
						<td mat-cell
						    *matCellDef="let room">
							{{ room.capacity }}
						</td>
					</ng-container>
					
					<ng-container matColumnDef="amenities">
						<th mat-header-cell
						    *matHeaderCellDef
						    mat-sort-header="amenities">
							Amenities
						</th>
						<td mat-cell
						    *matCellDef="let room">
							{{ room.amenities }}
						</td>
					</ng-container>
					
					<ng-container matColumnDef="isActive">
						<th mat-header-cell
						    *matHeaderCellDef
						    mat-sort-header="isActive">
							Active
						</th>
						<td mat-cell
						    *matCellDef="let room">
							{{ room.isActive }}
						</td>
					</ng-container>
					
					<ng-container matColumnDef="createdOn">
						<th mat-header-cell
						    *matHeaderCellDef
						    mat-sort-header="createdOn">
							Created
						</th>
						<td mat-cell
						    *matCellDef="let room">
							{{ room.createdOn }}
						</td>
					</ng-container>
					
					<ng-container matColumnDef="action">
						<th mat-header-cell
						    *matHeaderCellDef
						    mat-sort-header="action">
							Action
						</th>
						<td mat-cell
						    *matCellDef="let room">
							<button class="action-btn"
							        (click)="onView(room.id, room)">
								View
							</button>
						</td>
					</ng-container>
					
					<tr mat-header-row
					    *matHeaderRowDef="displayedColumns"></tr>
					<tr mat-row
					    *matRowDef="let row; columns: displayedColumns;"></tr>
				</table>
				
				<mat-paginator [pageSizeOptions]="[10,20,50]"
				               [selectConfig]="{panelClass: 'paginator'}"
				               class="m-4 rounded-box!"
				               showFirstLastButtons
				               aria-label="List All Rooms"></mat-paginator>
			</div>
			
			<div class="card-body self-center flex justify-center items-center">
				<button class="action-btn w-fit"
				        (click)="onAddRoom()">
					Add Room
				</button>
			</div>
		}
	
	</div>
</div>
