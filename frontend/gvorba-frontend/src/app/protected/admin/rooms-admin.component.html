<div class="min-h-[calc(100vh-74px)] bg-base-200 p-4 flex justify-center content-center w-auto items-start">
	<div class="card shadow-lg bg-base-100 flex flex-col py-4 overflow-x-auto w-fit justify-center top-0">
		
		@if (isLoading()) {
			<h1 class="px-4 text-center text-2xl font-bold">
				Room Management
			</h1>
			<mat-spinner diameter="48"
			             class="self-center m-4"
			             aria-label="loading"></mat-spinner>
		} @else {
			<h1 class="text-center text-2xl font-bold">
				Room Management
			</h1>
			<div class="card-body flex justify-center items-center">
				<table class="mat-elevation-x8 mx-2 w-max
											max-sm:[&_th]:px-0! max-sm:[&_td]:px-0! [&_th]:px-4! [&_td]:px-4!"
				       mat-table
				       matSort
				       [dataSource]="dataSource">
					
					<ng-container matColumnDef="id">
						<th mat-header-cell
						    class="hidden xl:table-cell"
						    *matHeaderCellDef
						    mat-sort-header="id">
							Id
						</th>
						<td mat-cell
						    class="hidden xl:table-cell"
						    *matCellDef="let room">
							{{ room.id }}
						</td>
					</ng-container>
					
					<ng-container matColumnDef="name">
						<th mat-header-cell
						    class="max-w-24 lg:max-w-32"
						    *matHeaderCellDef
						    mat-sort-header="name">
							Name
						</th>
						<td mat-cell
						    class="max-w-24 lg:max-w-32"
						    *matCellDef="let room">
							{{ room.name }}
						</td>
					</ng-container>
					
					<ng-container matColumnDef="location">
						<th mat-header-cell
						    class="max-w-24 lg:max-w-32"
						    *matHeaderCellDef
						    mat-sort-header="location">
							Location
						</th>
						<td mat-cell
						    class="max-w-24 lg:max-w-32"
						    *matCellDef="let room">
							{{ room.location }}
						</td>
					</ng-container>
					
					<ng-container matColumnDef="capacity">
						<th mat-header-cell
						    class="hidden lg:table-cell"
						    *matHeaderCellDef
						    mat-sort-header="capacity">
							Capacity
						</th>
						<td mat-cell
						    class="hidden lg:table-cell"
						    *matCellDef="let room">
							{{ room.capacity }}
						</td>
					</ng-container>
					
					<ng-container matColumnDef="amenities">
						<th mat-header-cell
						    class="hidden sm:table-cell max-w-24 md:max-w-32"
						    *matHeaderCellDef
						    mat-sort-header="amenities">
							Amenities
						</th>
						<td mat-cell
						    class="hidden sm:table-cell max-w-24 md:max-w-32"
						    *matCellDef="let room">
							{{ room.amenities }}
						</td>
					</ng-container>
					
					<ng-container matColumnDef="isActive">
						<th mat-header-cell
						    *matHeaderCellDef
						    mat-sort-header="isActive">
							Active
						</th>
						<td mat-cell
						    *matCellDef="let room">
							{{ room.isActive }}
						</td>
					</ng-container>
					
					<ng-container matColumnDef="createdOn">
						<th mat-header-cell
						    class="hidden xl:table-cell"
						    *matHeaderCellDef
						    mat-sort-header="createdOn">
							Created
						</th>
						<td mat-cell
						    class="hidden xl:table-cell"
						    *matCellDef="let room">
							{{ room.createdOn | date:'short'}}
						</td>
					</ng-container>
					
					<ng-container matColumnDef="action">
						<th mat-header-cell
						    *matHeaderCellDef
						    mat-sort-header="action">
							Action
						</th>
						<td mat-cell
						    *matCellDef="let room">
							<button class="action-btn max-lg:px-8! max-lg:max-w-2!"
							        (click)="onManage(room.id, room)">
								Manage
							</button>
						</td>
					</ng-container>
					
					<tr mat-header-row
					    *matHeaderRowDef="displayedColumns"></tr>
					<tr mat-row
					    *matRowDef="let row; columns: displayedColumns;"></tr>
				</table>
				
				<mat-paginator [pageSizeOptions]="[10,20,50]"
				               [selectConfig]="{panelClass: 'paginator'}"
				               class="m-4 rounded-box!"
				               showFirstLastButtons
				               aria-label="List All Rooms"></mat-paginator>
			</div>
			
			<div class="card-body self-center flex justify-center items-center">
				<button class="action-btn w-fit"
				        (click)="onAddRoom()">
					Add Room
				</button>
			</div>
		}
	
	</div>
</div>
