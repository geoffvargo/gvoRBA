<div class="min-h-[calc(100vh-74px)] bg-base-200 p-4 flex justify-center content-center w-auto items-start">
	<div class="card shadow-lg bg-base-100 flex flex-col py-4 overflow-x-auto w-fit justify-center top-0">
		@if (isLoading()) {
			<h1 class="py-4 text-center text-2xl font-bold">
				All Users
			</h1>
			<mat-spinner diameter="48"
			             class="self-center m-4"
			             aria-label="loading"></mat-spinner>
		} @else {
			<h1 class="text-center text-2xl font-bold">
				All Users
			</h1>
			
			<div class="card-body flex justify-center items-center">
				<table class="mat-elevation-x8 mx-2 w-max
											max-sm:[&_th]:px-0! max-sm:[&_td]:px-0! [&_th]:px-4! [&_td]:px-4!"
				       mat-table
				       matSort
				       [dataSource]="dataSource">
					
					<ng-container matColumnDef="id">
						<th mat-header-cell
						    class="hidden xl:table-cell"
						    *matHeaderCellDef
						    mat-sort-header="id">
							User Id
						</th>
						<td mat-cell
						    class="hidden xl:table-cell"
						    *matCellDef="let user">
							{{ user.id }}
						</td>
					</ng-container>
					
					<ng-container matColumnDef="name">
						<th mat-header-cell
						    class="text-center! [&_.mat-sort-header-container]:justify-center!"
						    *matHeaderCellDef
						    mat-sort-header="name">
							User Name
						</th>
						<td mat-cell
						    class="text-center!"
						    *matCellDef="let user">
							{{ user.name }}
						</td>
					</ng-container>
					
					<ng-container matColumnDef="email">
						<th mat-header-cell
						    class="hidden lg:table-cell"
						    *matHeaderCellDef
						    mat-sort-header="email">
							User Email
						</th>
						<td mat-cell
						    class="hidden lg:table-cell"
						    *matCellDef="let user">
							{{ user.email }}
						</td>
					</ng-container>
					
					<ng-container matColumnDef="role">
						<th mat-header-cell
						    *matHeaderCellDef
						    mat-sort-header="role">
							User Role
						</th>
						<td mat-cell
						    *matCellDef="let user">
							{{ user.role.roleName }}
						</td>
					</ng-container>
					
					<ng-container matColumnDef="created_on">
						<th mat-header-cell
						    class="hidden sm:table-cell"
						    *matHeaderCellDef
						    mat-sort-header="created_on">
							User Created On
						</th>
						<td mat-cell
						    class="hidden sm:table-cell"
						    *matCellDef="let user">
							{{ user.createdOn | date:'short'}}
						</td>
					</ng-container>
					
					<ng-container matColumnDef="enabled">
						<th mat-header-cell
						    class="text-center! [&_.mat-sort-header-container]:justify-center!"
						    *matHeaderCellDef
						    mat-sort-header="enabled">
							User Enabled
						</th>
						<td mat-cell
						    class="text-center!"
						    *matCellDef="let user">
							{{ user.enabled }}
						</td>
					</ng-container>
					
					<ng-container matColumnDef="action">
						<th mat-header-cell
						    *matHeaderCellDef
						    mat-sort-header="action">
							Action
						</th>
						<td mat-cell
						    *matCellDef="let user">
							<button class="action-btn max-sm:px-2 max-sm:max-w-0"
							        (click)="onView(user.id)">
								View
							</button>
						</td>
					</ng-container>
					
					<tr mat-header-row
					    class="text-center! w-fit!"
					    *matHeaderRowDef="displayedColumns"></tr>
					<tr mat-row
					    class="text-center!"
					    *matRowDef="let row; columns: displayedColumns;"></tr>
				</table>
				
				<mat-paginator [pageSizeOptions]="[10,20,50]"
				               [selectConfig]="{panelClass: 'paginator'}"
				               class="m-4 rounded-box!"
				               showFirstLastButtons
				               aria-label="List All Users"></mat-paginator>
			</div>
			
			<div class="card-body self-center flex justify-center items-center">
				<button class="action-btn w-fit"
				        (click)="onAddUser()">
					Add User
				</button>
			</div>
		}
	</div>

</div>
