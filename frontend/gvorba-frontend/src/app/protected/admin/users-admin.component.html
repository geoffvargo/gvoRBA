<div class="min-h-[calc(100vh-74px)] bg-base-200 p-4 flex justify-center content-center w-auto items-start">
	<div class="card shadow-lg bg-base-100 flex flex-col py-4 overflow-x-auto w-fit justify-center top-0">
		<h1 class="text-center text-2xl font-bold">
			All Users
		</h1>
		@if (isLoading()) {
			<span>Loading...</span>
		} @else {
			<div class="card-body flex justify-center items-center">
				<table class="mat-elevation-x8 mx-16 w-max"
				       mat-table
				       matSort
				       [dataSource]="dataSource">
					
					<ng-container matColumnDef="id">
						<th mat-header-cell
						    *matHeaderCellDef
						    mat-sort-header="id">
							User Id
						</th>
						<td mat-cell
						    *matCellDef="let user">
							{{ user.id }}
						</td>
					</ng-container>
					
					<ng-container matColumnDef="name">
						<th mat-header-cell
						    *matHeaderCellDef
						    mat-sort-header="name">
							User Name
						</th>
						<td mat-cell
						    *matCellDef="let user">
							{{ user.name }}
						</td>
					</ng-container>
					
					<ng-container matColumnDef="email">
						<th mat-header-cell
						    *matHeaderCellDef
						    mat-sort-header="email">
							User Email
						</th>
						<td mat-cell
						    *matCellDef="let user">
							{{ user.email }}
						</td>
					</ng-container>
					
					<ng-container matColumnDef="role">
						<th mat-header-cell
						    *matHeaderCellDef
						    mat-sort-header="role">
							User Role
						</th>
						<td mat-cell
						    *matCellDef="let user">
							{{ user.role.roleName }}
						</td>
					</ng-container>
					
					<ng-container matColumnDef="created_on">
						<th mat-header-cell
						    *matHeaderCellDef
						    mat-sort-header="created_on">
							User Created On
						</th>
						<td mat-cell
						    *matCellDef="let user">
							{{ user.createdOn }}
						</td>
					</ng-container>
					
					<ng-container matColumnDef="enabled">
						<th mat-header-cell
						    *matHeaderCellDef
						    mat-sort-header="enabled">
							User Enabled
						</th>
						<td mat-cell
						    *matCellDef="let user">
							{{ user.enabled }}
						</td>
					</ng-container>
					
					<ng-container matColumnDef="action">
						<th mat-header-cell
						    *matHeaderCellDef
						    mat-sort-header="action">
							Action
						</th>
						<td mat-cell
						    *matCellDef="let user">
							<button class="action-btn"
							        (click)="onView(user.id)">
								View
							</button>
						</td>
					</ng-container>
					
					<tr mat-header-row
					    *matHeaderRowDef="displayedColumns"></tr>
					<tr mat-row
					    *matRowDef="let row; columns: displayedColumns;"></tr>
				</table>
				
				<mat-paginator [pageSizeOptions]="[10,20,50]"
				               [selectConfig]="{panelClass: 'paginator'}"
				               class="m-4 rounded-box!"
				               showFirstLastButtons
				               aria-label="List All Users"></mat-paginator>
			</div>
			
			<div class="card-body self-center flex justify-center items-center">
				<button class="action-btn w-fit"
				        (click)="onAddUser()">
					Add User
				</button>
			</div>
		}
	</div>

</div>
