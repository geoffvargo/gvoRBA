<header class="h-headerHeight w-max min-w-full bg-base-100 shadow-lg flex items-center sticky top-0 z-9999">
	<nav class="flex p-4 w-full h-full items-center justify-between">
		<a class="min-w-0 truncate"
		   (click)="menuVisible.set(false)"
		   routerLink="">
			<h3>gvoRBA</h3>
		</a>
		
		<ul class="flex flex-col lg:flex-row absolute lg:static lg:shadow-none lg:max-h-none sm:max-sm:px-10 pl-4 inset-x-0
								top-full bg-base-100 shrink-0 gap-4 items-center transition-all duration-300 ease-in-out
								overflow-hidden "
		    id="desktopLinks"
		    [ngClass]="menuVisible() ? 'max-h-100 py-4 items-start shadow-lg' : 'max-h-0'">
			@if (isLoggedIn()) {
				<li>
					<a routerLink="/rooms"
					   (click)="toggleMenu()"
					   class="py-2 cursor-pointer hover:text-slate-300"
					   [class.font-semibold]="router.url === '/rooms'">
						Rooms
					</a>
				</li>
				
				<li>
					<a [routerLink]="isAdmin() ? '/admin/bookings' : '/bookings'"
					   (click)="toggleMenu()"
					   class="py-2 cursor-pointer hover:text-slate-300"
					   [class.font-semibold]="isAdmin() ? router.url === '/admin/bookings' : router.url ==='/bookings'">
						Bookings
					</a>
				</li>
				
				@if (isAdmin()) {
					<li>
						<a class="py-2 cursor-pointer hover:text-slate-300"
						   (click)="toggleMenu()"
						   routerLink="/admin/users"
						   [class.font-semibold]="router.url === '/admin/users'">
							User Management
						</a>
					</li>
					
					<li>
						<a class="py-2 cursor-pointer hover:text-slate-300"
						   (click)="toggleMenu()"
						   routerLink="/admin/rooms"
						   [class.font-semibold]="router.url === '/admin/rooms'">
							Room Management
						</a>
					</li>
				}
				
				<li>
					<a class="py-2 cursor-pointer hover:text-slate-300"
					   tabindex="0"
					   (click)="onLogout()"
					   (keyup.enter)="onLogout()"
					   (keydown.space)="onLogout()">
						Logout
					</a>
				</li>
			} @else {
				<li>
					<a class="py-2 cursor-pointer hover:text-slate-300"
					   (click)="toggleMenu()"
					   routerLink="/signup"
					   [class.font-semibold]="router.url === '/signup'">
						Sign Up
					</a>
				</li>
			}
		</ul>
		
		<div id="mobileLinks"
		     class="select-none lg:hidden">
			@if (menuVisible()) {
				<span class="material-symbols-outlined cursor-pointer"
				      tabindex="0"
				      (click)="toggleMenu()"
				      (keyup.enter)="toggleMenu()"
				      (keydown.space)="toggleMenu()">
					close
				</span>
			} @else {
				<span class="material-symbols-outlined cursor-pointer"
				      tabindex="0"
				      (click)="toggleMenu()"
				      (keyup.enter)="toggleMenu()"
				      (keydown.space)="toggleMenu()">
					menu
				</span>
			}
		</div>
	</nav>
</header>
