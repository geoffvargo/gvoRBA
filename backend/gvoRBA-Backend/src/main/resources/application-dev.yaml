app:
  oauth2:
    frontend-redirect-uri: http://localhost:8080/api/dev/oauth2-echo
  mail:
    from: ${MAIL_FROM:no-reply@gvorba.local}

spring:
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 3000
      "[mail.smtp.writetimeout]": 5000
