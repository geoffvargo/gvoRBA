app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  refresh:
    ttl-days: ${REFRESH_TTL_DAYS:7}
  cookie:
    same-site: ${COOKIE_SAME_SITE:None}
  oauth2:
    frontend-redirect-uri: ${REDIRECT_URI:http://localhost:4200/oauth2/callback}

spring:
  application:
    name: gvoRBA Backend

  app:
    jwtSecret: "mySecretKey123912738aopsgjnspkmndfsopkvajoirjg94gf2opfng2moknm"
    jwtExpirationMs: 900_000

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/booking}
    username: ${DB_USERNAME:booking}
    password: ${DB_PASSWORD:booking}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}
    show-sql: ${SHOW_SQL:true}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${CLIENT_ID_GOOGLE:1079077201382-8hahkv3rnme49hgpqg808n19fqmrtrl2.apps.googleusercontent.com}
            client-secret: ${CLIENT_SECRET_GOOGLE:}
            scope: [openid, profile, email]
            redirect-uri: ${OAUTH2_BASE_URL:{baseUrl}}/login/oauth2/code/{registrationId}
          github:
            client-id: ${CLIENT_ID_GITHUB:Ov23lix2iFbI3XbAIpqv}
            client-secret: ${CLIENT_SECRET_GITHUB:}
            scope: [read:user, user:email]
            redirect-uri: ${OAUTH2_BASE_URL:{baseUrl}}/login/oauth2/code/{registrationId}

server:
  port: ${PORT:8080}

logging:
  level:
    org:
      springframework:
        security: ${SEC_LOG:debug}
        security.oauth2: ${OAUTH_LOG:debug}
        web: ${WEB_LOG:debug}
