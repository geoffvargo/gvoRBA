name: Verify Secrets
on:
  push:
    branches:
      - new-workflow/verify-secrets

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Check secrets are non-empty
        run: |
          check() { if [ -z "$2" ]; then echo "EMPTY: $1"; else echo "ok: $1"; fi; }
          check AWS_ROLE_ARN "${{ secrets.AWS_ROLE_ARN }}"
          check AWS_REGION "${{ secrets.AWS_REGION }}"
          check ECR_REPOSITORY "${{ secrets.ECR_REPOSITORY }}"
          check EC2_HOST "${{ secrets.EC2_HOST }}"
          check EC2_SSH_KEY "${{ secrets.EC2_SSH_KEY }}"
          check S3_BUCKET "${{ secrets.S3_BUCKET }}"
          check CLOUDFRONT_DISTRIBUTION_ID "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}"

      - name: Test OIDC role assumption
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Confirm identity and permissions
        run: |
          aws sts get-caller-identity
          aws s3 ls s3://${{ secrets.S3_BUCKET }}
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} > /dev/null && echo "ECR auth ok"

      - name: Test SSH to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: whoami && docker compose version
